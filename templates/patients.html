{% extends 'base.html' %}
{% block content %}
<h2>Patient Records</h2>
<table class="table table-striped">
    <thead>
        <tr>
            <th>Full Name</th>
            <th>DOB</th>
            <th>Phone</th>
            <th>Email</th>
            <th>Address</th>
        </tr>
    </thead>
    <tbody>
        {% for patient in patients %}
        <tr>
            <td>{{ patient.full_name }}</td>
            <td>{{ patient.date_of_birth }}</td>
            <td>{{ patient.phone }}</td>
            <td>{{ patient.email }}</td>
            <td>{{ patient.address }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
