{% extends 'base.html' %}
{% block content %}
<h2 class="text-center mb-4">Record New Sale</h2>
<form method="post" class="shadow">
    <div class="mb-3">
        <label for="patient_id" class="form-label">Patient (optional)</label>
        <select name="patient_id" class="form-select">
            <option value="">Walk-in</option>
            {% for patient in patients %}
            <option value="{{ patient.patient_id }}">{{ patient.full_name }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="mb-3">
        <label for="employee_id" class="form-label">Pharmacist</label>
        <select name="employee_id" class="form-select" required>
            {% for employee in employees %}
            <option value="{{ employee.employee_id }}">{{ employee.full_name }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="mb-3">
        <label for="total_amount" class="form-label">Total Amount (KGS)</label>
        <input type="number" step="0.01" name="total_amount" class="form-control" required>
    </div>
    <div class="mb-3">
        <label for="payment_method" class="form-label">Payment Method</label>
        <select name="payment_method" class="form-select" required>
            <option value="Cash">Cash</option>
            <option value="Card">Card</option>
            <option value="M-Bank">M-Bank</option>
        </select>
    </div>
    <button type="submit" class="btn btn-primary">Submit Sale</button>
</form>
{% endblock %}
