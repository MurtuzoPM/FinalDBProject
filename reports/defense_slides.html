# Project Defense
## Naryn Central Pharmacy System
---
## Slide 1: Project Overview
- **Project**: Naryn Central Pharmacy Inventory & Prescription System
- **Lead Developer**: Mamadziyoev Murtuzo
- **Date**: May 2026
---
## Slide 2: Problem Statement
- **Objective**: Digitize a small pharmacy in Naryn.
- **Challenges**:
  - Expiry tracking
  - Prescription verification
  - Stock management
---
## Slide 3: ER Diagram
- **Core Entities**: Medicines, Suppliers, Patients, Employees, Sales.
- **Key Relationships**:
  - Many-to-many (Sales-Batches)
  - Self-referencing (Category hierarchy & Staff)
---
## Slide 4: Database Schema
- **Tables**: 10 tables in 3NF.
- **Constraints**:
  - FK enforcement
  - CHECK constraints (e.g., non-negative quantity)
  - UNIQUE constraints on emails
---
## Slide 5: Normalization
- **Goal**: Reach 3NF to prevent anomalies.
- **Process**:
  - Identifying FDs
  - Decomposition of sales into header/items
---
## Slide 6: Realistic Seed Data
- **Volume**: 500+ rows.
- **Locale**: Kyrgyz names, addresses, and phone formats.
- **Distribution**: Non-uniform patterns for realistic simulation (Pareto distribution on sales).
---
## Slide 7: Advanced SQL Features
- **Views**: Low stock, expiring soon, sales reports.
- **Roles**: Admin, Pharmacist, Manager with granular permissions.
- **Transactions**: Ensuring atomicity in sales processing and stock updates.
---
## Slide 8: Demonstration Queries
- Complex JOINS across multiple tables
- Common Table Expressions (CTEs)
- Aggregate functions with HAVING clauses
---
## Slide 9: Frontend Overview
- **Stack**: Python, Flask, Psycopg2, Bootstrap 5.
- **Features**:
  - View inventory & patients
  - Record new sales
  - Responsive, polished UI
---
## Slide 10: Conclusion & Reflection
- **Key Learnings**: Database integrity, PostgreSQL administration.
- **Future Work**:
  - Prescription AI verification
  - Mobile integration
  - Inventory forecasting
